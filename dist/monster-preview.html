<!doctype html><html lang="ko"><meta charset="utf-8"><title>몬스터 미리보기</title><style>body{margin:0;background:#c8c1b3;font:16px sans-serif;color:#242930}header{position:absolute;top:24px;left:32px}h1{font-size:24px}footer{position:absolute;bottom:28px;width:100%;display:flex;justify-content:space-around}b{font-size:20px}span{display:block;margin-top:8px;font-size:14px}</style><header><h1>몬스터 미리보기</h1>게임에 적용한 3D 모델 · 준비 → 공격 → 회복</header><footer><div><b>잿빛 사냥개</b><span>추격 후 돌진</span></div><div><b>낫발 벌레</b><span>측면 이동 후 베기</span></div><div><b>갈퀴 임프</b><span>도약 후 내려찍기</span></div></footer><script type="module">
import * as T from './three.module.js';import {MONSTERS,createMonster,animateMonster} from './monsters.mjs';
const scene=new T.Scene();scene.background=new T.Color(0xc8c1b3);const camera=new T.OrthographicCamera(-6,6,3.6,-3.6,.1,100);camera.position.set(3,5,11);camera.lookAt(0,.8,0);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(devicePixelRatio);renderer.shadowMap.enabled=true;document.body.append(renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x606060,2));const light=new T.DirectionalLight(0xffffff,3);light.position.set(-3,8,5);scene.add(light);const floor=new T.Mesh(new T.PlaneGeometry(100,100),new T.MeshStandardMaterial({color:0xc8c1b3}));floor.rotation.x=-Math.PI/2;floor.position.y=-.04;scene.add(floor);const ms=MONSTERS.map((s,type)=>{const model=createMonster(type);scene.add(model.g);return {...model,type,x:(type-1)*3.7,z:0,dir:new T.Vector3(-.65,0,1)};});window.monsterPreview={count:ms.length};function frame(t){requestAnimationFrame(frame);for(const m of ms){const s=MONSTERS[m.type],p=new URLSearchParams(location.search).has("still")?0:(t/1000)%4;m.attackPhase=p<1?'chase':p<1+s.wind?'windup':p<1+s.wind+s.duration?'attack':'recover';m.attackElapsed=p-1-s.wind;m.moving=p<1;animateMonster(m,t/1000);}renderer.render(scene,camera);}requestAnimationFrame(frame);
</script></html>
