<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마법 효과 편집</title><link rel="stylesheet" href="elemental-editor.css?v=1"></head>
<body><header><div><small>ELEMENTAL SANDBOX</small><h1 id="title">마법 효과 편집</h1></div><button id="save" class="primary" disabled>이 마법에 저장</button></header>
<main inert><section class="preview"><div id="stage"><canvas aria-label="선택한 마법 효과 미리보기"></canvas><div id="loading" role="status">효과를 불러오는 중입니다.</div></div><div class="playback"><button id="cast">다시 시전</button><button id="pause" aria-pressed="false">일시정지</button><button id="freeze">펼친 상태로 멈추기</button><button id="step">한 프레임 진행</button><button id="home">시점 초기화</button><label>재생 속도 <select id="speed"><option value="0.25">0.25배</option><option value="0.5">0.5배</option><option value="1" selected>1배</option></select></label><label><input id="repeat" type="checkbox" checked> 반복 재생</label><output id="time">0.00초</output></div><p class="hint">드래그로 회전 · 휠로 확대 · 멈춘 상태에서도 색과 모양을 조절할 수 있습니다.</p><p id="status" role="status" aria-live="polite"></p></section>
<aside><label class="effect-label" for="effect">기본 효과</label><select id="effect" disabled></select><div id="controls"></div><details><summary>입자와 빛</summary><div id="sharedControls"></div></details><section class="files"><button id="loadSaved">저장한 효과 불러오기</button><button id="reset">기본값으로 되돌리기</button><button id="export">효과 파일 내보내기</button><button id="import">효과 파일 불러오기</button><input id="file" type="file" accept="application/json,.json" hidden></section><p class="hint">저장한 효과와 작업 중인 초안은 이 브라우저에 보관됩니다. 다른 기기에서는 효과 파일을 불러와 주세요.</p><p class="hint">효과 설계용 미리보기입니다. 저장해도 현재 게임의 효과·공격력·판정은 바뀌지 않습니다.</p><a class="credit" href="https://github.com/achrefelouafi/LinearAbiltyCastingThreeJS" target="_blank" rel="noopener">원본 프로젝트 · MIT 라이선스</a></aside></main>
<script type="module" src="elemental-editor.mjs?v=1"></script></body></html>
