<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>타격감 · 일반마법사 커리큘럼</title><link rel="stylesheet" href="impact-lab.css"></head><body>
<header><div><a class="back" href="index.html?v=ice-step-1">← 결투 연습</a><h1>타격감</h1></div><p>공격과 피격 연출을 조절하며 차이를 확인하세요.</p><span id="saveStatus" role="status">설정을 불러오는 중</span></header>
<main><section class="preview"><div class="preview-head"><div><span class="eyebrow">불덩이 공격</span><h2>타격감 미리보기</h2></div><label class="check"><input type="checkbox" id="compare" checked> 효과 없는 모습 비교</label></div><div id="stage"><canvas id="scene" aria-label="왼쪽 공격 캐릭터가 오른쪽 대상에게 불덩이를 발사하는 3D 미리보기"></canvas><div id="baselineLabel" class="scene-label">효과 없음</div><div id="tunedLabel" class="scene-label">현재 설정</div><span id="phase">준비</span><div id="canvasError" hidden role="alert">3D 화면을 열지 못했습니다. 브라우저에서 하드웨어 가속을 켠 뒤 새로고침해 주세요.</div></div><div class="playback"><button id="play" class="primary">일시정지</button><button id="replay">처음부터 재생</button><label>속도 <select id="speed"><option value="0.25">0.25배</option><option value="0.5">0.5배</option><option value="1" selected>1배</option></select></label><button id="sound" aria-pressed="false">소리 켜기</button></div><label class="timeline">재생 위치 <output id="timeLabel">0.00초</output><input id="scrub" type="range" min="0" max="1" step="0.001" value="0"></label><p class="scope">설정은 이 페이지의 미리보기에만 적용되며, 이 브라우저에 자동 저장됩니다. 결투의 공격 판정과 실제 동작은 바뀌지 않습니다.</p><details class="references"><summary>참고 영상</summary><a href="https://www.instagram.com/reel/DecdQ9ltnjf/" target="_blank" rel="noopener">타격감 연출 5가지 ↗</a><a href="https://www.instagram.com/reel/DejpGOctoHu/" target="_blank" rel="noopener">공격에 적용하는 애니메이션 원리 ↗</a></details></section><aside><div class="presets"><label>시작 설정 <select id="preset"><option value="custom">직접 조절</option><option value="none">효과 없음</option><option value="default" selected>기본 타격감</option><option value="heavy">강한 타격감</option></select></label><button id="reset">기본값 복원</button></div><div id="controls"></div><button id="export">설정 파일 저장</button><p class="hint">슬라이더를 바꾸면 현재 화면부터 반영됩니다. 준비 동작은 다음 공격에서 확인하세요.</p></aside></main><script type="module" src="impact-lab.mjs"></script></body></html>
