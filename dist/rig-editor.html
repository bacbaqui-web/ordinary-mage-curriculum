<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>늑대 리깅 편집</title><link rel="stylesheet" href="rig-editor.css"></head><body>
<header><div><small>ORDINARY MAGE / MODEL TOOLS</small><h1>리깅 위치 편집</h1></div><div class="actions"><label class="button">GLB 열기<input id="file" type="file" accept=".glb" hidden></label><button id="download" class="primary" disabled>수정한 GLB 저장</button><a href="index.html">게임으로</a></div></header>
<main><aside><div class="section-title">관절 <span id="count">0</span></div><input id="search" placeholder="관절 이름 검색" aria-label="관절 이름 검색"><div id="bones" role="list" aria-label="관절 목록"></div></aside><section id="viewport"><div class="viewbar"><button data-view="side">옆면</button><button data-view="front">정면</button><button data-view="back">뒷면</button><button data-view="top">위쪽</button><button id="fit">전체 보기</button></div><div id="hint">관절 점을 선택한 뒤 화살표를 드래그하세요.</div><div class="legend"><i></i>현재 관절 <i class="old"></i>원래 위치</div><div id="status" role="status">늑대 모델을 불러오는 중입니다.</div></section><aside class="properties"><div class="section-title">선택한 관절</div><h2 id="name">관절을 선택하세요</h2><p id="parent"></p><fieldset id="edit" disabled><legend>위치 · 모델 좌표</legend><div class="coordinates"><label>X<input id="x" type="number" step="0.001"></label><label>Y<input id="y" type="number" step="0.001"></label><label>Z<input id="z" type="number" step="0.001"></label></div><label class="check"><input id="children" type="checkbox">자식 관절도 함께 이동</label><button id="resetBone">이 관절 위치 복원</button><hr><legend>회전으로 변형 확인</legend><select id="axis" aria-label="회전 축"><option value="x">X축</option><option value="y">Y축</option><option value="z">Z축</option></select><input id="pose" type="range" min="-45" max="45" value="0" aria-label="관절 회전 미리보기"><output id="angle">0°</output><button id="clearPose">기본 자세로</button></fieldset><hr><div class="section-title">화면 표시</div><label class="check"><input id="showBones" type="checkbox" checked>관절과 연결선 표시</label><label class="check"><input id="ghost" type="checkbox" checked>원래 뼈 위치 비교</label><label class="check"><input id="transparent" type="checkbox">모델 반투명</label><div class="actions history"><button id="undo" disabled>실행 취소</button><button id="redo" disabled>다시 실행</button></div><button id="resetAll">모두 원래대로</button><p class="note">드래그: 시점 회전 · 휠: 확대<br>우클릭 드래그: 화면 이동<br>Ctrl / ⌘ Z: 실행 취소</p><p class="note">뼈 위치를 바꿔도 기본 모델 형태는 유지됩니다. 가중치와 뼈 연결 구조는 유지합니다. 저장 파일에는 미리보기 회전과 기존 애니메이션이 포함되지 않습니다.</p></aside></main><script type="module" src="rig-editor.mjs?v=1"></script></body></html>
