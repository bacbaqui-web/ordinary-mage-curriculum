<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>3D 동작 → 2D 캐릭터</title><style>body{margin:0;background:#202b34;color:#edf0ec;font:15px system-ui}aside{position:absolute;top:20px;left:20px;padding:22px;background:#14202ce8;border-radius:14px;width:280px}h1{font-size:20px}label{display:block;margin:14px 0}input[type=range],select{width:100%}button,input,select{font:inherit}button,a{margin:5px;color:inherit}button{background:#344952;border:0;padding:10px;border-radius:6px}small{display:block;color:#b5c5cb;line-height:1.6}#status{line-height:1.5}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}aside{max-height:calc(100vh - 84px);overflow:auto}details{max-height:240px;overflow:auto}@media(max-width:700px){canvas{height:50vh}aside{top:50vh;left:0;width:100%;height:50vh;max-height:none;box-sizing:border-box;border-radius:0;padding:16px}h1{margin-top:0}}</style><canvas id="view"></canvas><aside><h1>3D 동작 → 2D 캐릭터</h1><p>색 몸체가 3D 관절을 따라 움직입니다.</p><label>동작 파일 <input id="file" type="file" accept=".glb,.gltf,.bvh"></label><small>Mixamo 이름은 자동 연결합니다. glTF는 데이터가 파일 안에 포함된 경우를 지원합니다. 파일은 서버로 전송하지 않습니다.</small><p id="status">기본 걷기 · 3D 키프레임 동작</p><select id="clip" aria-label="동작"></select><small>예비 2프레임 → 최종 자세 4프레임 → 부드럽게 복귀. 다음 동작을 누르면 예약합니다. 복귀 중에는 바로 연결합니다.</small><div id="actions" aria-label="기본 동작"></div><button id="magicHold">마법 충전 · 누르고 유지</button><small>Space 또는 충전 버튼을 누르고 유지하세요. 1.2초부터 2륜 자세로 전환하며, 놓으면 시전합니다.</small><label>재생 위치<input id="seek" type="range" min="0" max="1000" value="0"></label><label>캐릭터 방향<input id="heading" type="range" min="-180" max="180" value="35"></label><label>카메라 높이<input id="elevation" type="range" min="0" max="75" value="25"></label><label>픽셀 크기 <select id="pixels"><option value="2">작게 · 2배</option><option value="4">보통 · 4배</option><option value="6" selected>크게 · 6배</option><option value="8">아주 크게 · 8배</option></select></label><label>동작 프레임 <select id="fps"><option value="8">초당 8장</option><option value="12" selected>초당 12장</option><option value="24">초당 24장</option><option value="0">부드럽게</option></select></label><label>재생 속도<input id="speed" type="range" min="0.1" max="2" step=".1" value="1"></label><button id="play">일시정지</button><button id="reset">기본 걷기</button><details><summary>관절 직접 연결</summary><div id="mapping"></div><button id="apply">연결 적용</button></details><p><a href="pose-editor.html">동작 편집</a> · <a href="index.html">게임으로 돌아가기</a></p></aside><script type="module" src="character-lab.mjs?v=heel-free-1"></script></html>
