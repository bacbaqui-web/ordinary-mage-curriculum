<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>동작 편집</title><link rel="stylesheet" href="pose-editor.css?v=timeline-3"><header><strong>동작 편집</strong><span>점을 끌어 위치를 정하세요. 네 화면이 함께 바뀝니다.</span><a id="labLink" href="character-lab.html">동작 확인</a><button id="saveMotion" title="Ctrl+S / ⌘S">동작 저장</button><button id="export">파일 저장</button><label class="button">파일 열기<input id="import" type="file" accept=".json" hidden></label></header><main><section id="views"></section><aside><label>캐릭터<select id="character"></select></label><fieldset id="motionControls"><details class="movement-settings"><summary>캐릭터 이동 설정</summary><label>기본 이동속도 <output id="baseMoveSpeedValue"></output><input id="baseMoveSpeed" aria-label="기본 이동속도" type="range" min="0.5" max="2" step="0.1"></label><label>머리 회전속도 <output id="headSpeedValue"></output><input id="headSpeed" aria-label="머리 회전속도" type="range" min="0" max="1440" step="30"></label><label>상체 회전속도 <output id="chestSpeedValue"></output><input id="chestSpeed" aria-label="상체 회전속도" type="range" min="0" max="1440" step="30"></label><label>하체 회전속도 <output id="pelvisSpeedValue"></output><input id="pelvisSpeed" aria-label="하체 회전속도" type="range" min="0" max="1440" step="30"></label><small>회전속도는 초당 회전 각도입니다. 숫자가 클수록 빠르며, 0은 즉시 회전합니다. 기본 이동속도는 AI 연습에 적용됩니다.</small><button id="resetMovement" type="button">이동 설정 초기화</button></details><label class="inline-field">동작<select id="action"></select></label><div class="foot-buttons"><label><input id="lockLeftFoot" type="checkbox"><span>왼발 고정</span></label><label><input id="lockRightFoot" type="checkbox"><span>오른발 고정</span></label></div><label class="inline-field">선택 부위<select id="joint"></select></label><div class="coords"><label>X · 좌우<input id="x" type="number" step=".01" min="-10" max="10"></label><label>Y · 높이<input id="y" type="number" step=".01" min="-10" max="10"></label><label>Z · 앞뒤<input id="z" type="number" step=".01" min="-10" max="10"></label></div><label><input id="handles" type="checkbox" checked> 관절·연결선 표시</label><p id="status" role="status"></p></fieldset></aside></main><footer><div class="row"><button id="play">재생</button><button id="previous">이전 키</button><button id="next">다음 키</button><strong id="frameLabel"></strong><label><input id="loopMotion" type="checkbox"> 반복 동작</label><label>전체 프레임<input id="frames" type="number" min="2" max="240"></label><label>초당 프레임<input id="fps" type="number" min="1" max="60"></label></div><div id="timelineScroll"><div id="timelineContent"><input id="scrub" type="range" min="0" value="0" step="1" aria-label="현재 프레임"><div id="timeline"></div></div></div></footer><script type="module" src="pose-editor.mjs?v=head-free-2"></script></html>
